[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "openmcmc"
version = "1.0.9"
description = "openMCMC tools"
authors = [
	{ name = "Bas van de Kerkhof" },
	{ name = "Matthew Jones" },
	{ name = "David Randell" },
]
urls = { Homepage = "https://sede-open.github.io/openMCMC/", Repository = "https://github.com/sede-open/openMCMC", Documentation = "https://sede-open.github.io/openMCMC/" }
readme = "README.md"
license = "Apache-2.0"
keywords = ["Markov Chain Monte Carlo", "MCMC"]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3.3",
    "numpy>=2.4.0",
    "scipy>=1.16.3",
    "tqdm>=4.67.1",
]

[dependency-groups]
contributor = [
    "black>=25.12.0",
    "isort>=7.0.0",
    "pydocstyle>=6.3.0",
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-cases>=3.9.1",
    "mkdocs-material>=9.7.1",
    "mkdocstrings-python>=2.0.1",
]
extras = [
    "matplotlib>=3.10.8",
    "pytictoc>=1.5.3",
]


[tool.hatch.build.targets.wheel]
packages = ["src/openmcmc"]

[tool.hatch.build.targets.sdist]
include = ["src/openmcmc", "tests", "README.md", "LICENSE.md"]

[tool.pytest.ini_options]
addopts = "--cov=openmcmc --cov-fail-under=90"
testpaths = [
    "tests",
]

[tool.coverage.run]
relative_files = true
source = ["src/"]

[tool.pylint]
fail-under=9.0
max-line-length=120
py-version=3.11

[tool.black]
line-length = 120
target-version = ['py311']

[tool.pydocstyle]
convention = "google"
add-ignore = ["D105", "D107"]

[tool.isort]
profile = "black"
